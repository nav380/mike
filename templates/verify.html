<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f2f2f2;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 350px;
            box-shadow: 0px 0px 12px rgba(0,0,0,0.15);
            text-align: center;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 18px;
            text-align: center;
            letter-spacing: 4px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: green;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
        }
        button:hover {
            background: darkgreen;
        }
        .email-info {
            font-size: 14px;
            color: gray;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Verify OTP</h2>

    <p class="email-info">OTP sent to <strong>{{ email }}</strong></p>

    <form method="post">
        {% csrf_token %}
        <input type="text" name="otp" placeholder="Enter OTP" maxlength="6" required>

        <button type="submit">Verify OTP</button>
    </form>
</div>

</body>
</html>
