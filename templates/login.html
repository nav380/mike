<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 min-h-screen flex items-center justify-center px-4">
   


    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
         {% if messages %}
<div class="mb-4">
    {% for message in messages %}
        <div 
            class="p-3 rounded mb-2 
            {% if message.tags == 'success' %}
                bg-green-100 text-green-700
            {% elif message.tags == 'error' %}
                bg-red-100 text-red-700
            {% else %}
                bg-blue-100 text-blue-700
            {% endif %}
        ">
            {{ message }}
        </div>
    {% endfor %}
</div>
{% endif %}
        
        <h2 class="text-3xl font-bold text-center text-gray-800 mb-6">Login</h2>

        <form method="POST" class="space-y-5">
            {% csrf_token %}

            <div>
                <label class="text-gray-600 font-medium">Email</label>
                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                    class="w-full mt-1 px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-green-600"
                />
            </div>

            <button
                type="submit"
                class="bg-green-600 text-white font-semibold px-4 py-2 w-full rounded-md hover:bg-green-700 transition"
            >
                Login
            </button>
        </form>

        <p class="text-center text-gray-600 mt-5">Don't have an account?</p>

        <a href="{% url 'register_user' %}"
           class="block text-center bg-blue-600 text-white font-semibold px-4 py-2 rounded-md hover:bg-blue-700 transition mt-2">
            Register
        </a>

    </div>

</body>

</html>
