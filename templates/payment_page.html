<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Payment</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #eef3f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #ffffff;
            width: 420px;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            text-align: center;
        }

        h2 {
            margin: 0;
            font-size: 26px;
            color: #1f1f1f;
        }

        .info-box {
            margin-top: 25px;
            padding: 18px;
            background: #f7f9fb;
            border-radius: 10px;
            text-align: left;
        }

        .info-box p {
            font-size: 16px;
            margin: 8px 0;
            color: #444;
        }

        h3 {
            margin-top: 20px;
            font-size: 20px;
            color: #007bff;
        }

        .pay-btn {
            margin-top: 25px;
            display: inline-block;
            padding: 12px 30px;
            background: #28a745;
            color: #fff;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s;
        }

        .pay-btn:hover {
            background: #1e7e34;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Registration Payment</h2>

        <div class="info-box">
            <p><strong>Name:</strong> {{ user.name }}</p>
            <p><strong>Email:</strong> {{ user.email }}</p>
        </div>

        <h3>Total Payable Amount: ₹{{ user.final_total }}</h3>

        <a href="{% url 'start_payment' %}" class="pay-btn">
            Pay Now
        </a>
    </div>

</body>
</html>
